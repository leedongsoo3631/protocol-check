name: 앱 빌드

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: upload
      KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 안드로이드 SDK 36 설치
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$ANDROID_HOME/cmdline-tools" || true
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: 서명키 준비
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "서명키 있음 → 플레이스토어용 파일도 만듭니다"
          else
            echo "::warning::서명키(KEYSTORE_BASE64)가 없어 테스트용 APK만 만듭니다"
          fi

      - name: 빌드
        run: |
          if [ -n "$KEYSTORE_PATH" ]; then T=":app:assembleRelease :app:bundleRelease"; else T=":app:assembleDebug"; fi
          set +e
          gradle $T --no-daemon --console=plain > build.log 2>&1
          code=$?
          set -e
          tail -40 build.log
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error:|ERROR|FAILURE|What went wrong|> " build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=빌드 실패::${msg}"
            exit 1
          fi

      - name: 파일 이름 정리
        run: |
          mkdir -p out
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/uijeon-check_v1.0.${VERSION_CODE}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "out/uijeon-check_playstore_v1.0.${VERSION_CODE}.aab"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "out/uijeon-check_test_v1.0.${VERSION_CODE}.apk"
          fi
          # 카톡 안내 카드의 고정 주소(releases/latest/download/uijeon-check.apk)용 — 항상 최신 앱
          cp "$(ls out/*.apk | head -1)" out/uijeon-check.apk
          ls -la out

      - name: 결과 파일 보관 (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: 의전체크-v1.0.${{ github.run_number }}
          path: out/*

      - name: 휴대폰에서 받기 쉬운 Releases 에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 의전 체크 v1.0.${{ github.run_number }}
          body: |
            ## 📱 의전 체크 설치하기 (안드로이드)

            ### ⬇️ [여기를 눌러 설치 파일 받기](https://github.com/leedongsoo3631/protocol-check/releases/latest/download/uijeon-check.apk)

            1. 위 링크를 누르면 `uijeon-check.apk` 가 내려받아집니다 → 알림이나 '내 파일 > 다운로드'에서 엽니다
            2. **'이 출처 허용'**(알 수 없는 앱 설치 허용)을 켜고 **설치**를 누릅니다
            3. 앱을 열어 **이름만 입력하면 끝** — 공유 서버에 자동으로 연결됩니다

            > 이전 시험용 앱이 있으면 먼저 지우고 설치하세요. 명단 편집 비밀번호는 담당자에게 따로 받으세요.

            **주요 기능** 도착 체크 실시간 공유 · 좌석배치도 · 현장 사진첩(카메라·PDF) · 일정·식순 · 담당자 채팅·위치 · 행사 결과 보고

            ---
            <sub>파일 안내: uijeon-check.apk = 최신 설치 파일(같은 링크로 항상 최신) · uijeon-check_v*.apk = 이 버전 파일 · *_playstore_*.aab = 구글 플레이 등록용</sub>
          files: out/*
